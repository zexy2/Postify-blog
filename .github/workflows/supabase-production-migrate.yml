name: Supabase Production Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect/dry-run or apply pending production migrations"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: "For apply only: type APPLY_fuiwcrqmxndguxymwoin"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: postify-production-supabase-migration
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: "2.116.0"
  SUPABASE_PROJECT_REF: "fuiwcrqmxndguxymwoin"

jobs:
  migrate:
    name: Inspect / Apply Production Schema
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Validate owner credentials and apply confirmation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is missing"; exit 1; }
          if [ "$MODE" = "apply" ] && [ "$CONFIRMATION" != "APPLY_${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::Apply confirmation does not match the production project ref"
            exit 1
          fi

      - name: Pin Supabase CLI
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version

      - name: Link exact production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Inspect remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Dry-run pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Deliberately do not use --include-all or migration repair.
          # If remote history is inconsistent, fail and inspect rather than guessing.
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply pending migrations
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Re-read migration history after apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration list \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Probe new public schema contracts
        if: inputs.mode == 'apply'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
          node --input-type=module <<'NODE'
          const base=process.env.SUPABASE_URL.replace(/\/$/,'');
          const headers={apikey:process.env.SUPABASE_ANON_KEY,Authorization:`Bearer ${process.env.SUPABASE_ANON_KEY}`};
          for(const resource of ['post_evidence_summary','post_failure_reports','post_revision_history']){
            const response=await fetch(`${base}/rest/v1/${resource}?select=*&limit=1`,{headers});
            if(!response.ok) throw new Error(`${resource} probe returned ${response.status}: ${(await response.text()).slice(0,300)}`);
            console.log(`${resource} ${response.status}`);
          }
          const canonicalResponse=await fetch(`${base}/rest/v1/posts?select=id,canonical_source_url&limit=1`,{headers});
          if(!canonicalResponse.ok) throw new Error(`canonical_source_url probe returned ${canonicalResponse.status}: ${(await canonicalResponse.text()).slice(0,300)}`);
          console.log(`canonical_source_url ${canonicalResponse.status}`);
          NODE

      - name: Trigger full main release verification after migration
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
