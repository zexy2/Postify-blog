name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: "24.20.0"

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint, Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security and browser runner parity
        run: npm run verify:security

      - name: Run release verification
        run: npm run verify

  docker-smoke:
    name: Docker Image Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag postify:ci .

      - name: Start production image
        run: docker run --detach --name postify-ci --publish 18080:80 postify:ci

      - name: Verify container health and root response
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if [ "$(curl --fail --silent http://127.0.0.1:18080/health || true)" = "healthy" ]; then
              curl --fail --silent --output /dev/null http://127.0.0.1:18080/
              exit 0
            fi
            sleep 1
          done
          docker logs postify-ci
          exit 1

      - name: Stop production image
        if: always()
        run: docker rm --force postify-ci || true

  ui-e2e:
    name: Chromium Product E2E
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: npm ci

      - name: Start product server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4174 --strictPort > /tmp/postify-vite.log 2>&1 &
          echo $! > /tmp/postify-vite.pid

      - name: Wait for product server
        run: |
          node --input-type=module <<'NODE'
          const deadline=Date.now()+30_000;
          while(Date.now()<deadline){
            try{const response=await fetch('http://127.0.0.1:4174/');if(response.ok)process.exit(0);}catch{}
            await new Promise((resolve)=>setTimeout(resolve,500));
          }
          process.exit(1);
          NODE

      - name: Run Chromium product suite
        run: npm run test:e2e:ui
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174

      - name: Run deterministic visual regression
        run: npm run test:e2e:visual
        env:
          PLAYWRIGHT_VISUAL_PORT: 4175

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/postify-vite.log || true

  schema-verify:
    name: Verified Knowledge Schema & RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postify
          POSTGRES_DB: postify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postify
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth roles for dry-run
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key,email text,raw_user_meta_data jsonb default '{}'::jsonb);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create schema storage;
          create table storage.buckets(
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects(
            id uuid primary key default gen_random_uuid(),
            bucket_id text,
            name text not null,
            owner_id text
          );
          alter table storage.objects enable row level security;
          create or replace function storage.foldername(name text)
          returns text[] language sql immutable
          as $$ select string_to_array(name, '/') $$;
          create role anon nologin;
          create role authenticated nologin;
          SQL
      - name: Apply all migrations in order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify -f "$migration"
          done
      - name: Verify RLS and abuse boundaries
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify -f supabase/verify-verified-knowledge.sql

  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [verify, docker-smoke, ui-e2e, schema-verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      deployed: ${{ steps.prereq.outputs.ready }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check deploy prerequisites
        id: prereq
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Secrets to enable automatic deployment."
          fi

      - name: Build
        if: steps.prereq.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://postify.zekiakgul.dev
          VITE_APP_NAME: Postify

      - name: Export production machine-readable knowledge
        if: steps.prereq.outputs.ready == 'true'
        run: npm run export:knowledge
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Stamp release identity
        if: steps.prereq.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const release={sourceSha:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),knowledgeBackend:'runtime-capability-artifact'};
          await writeFile('docs/release.json',JSON.stringify(release,null,2)+'\n');
          NODE

      - name: Deploy to GitHub Pages
        if: steps.prereq.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs


  production-browser-smoke:
    name: Production Chromium & Release Smoke
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
    container: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: npm ci

      - name: Wait for the exact source SHA on production
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected=process.env.EXPECTED_SHA;
          const deadline=Date.now()+360_000;
          let last='unavailable';
          while(Date.now()<deadline){
            try{
              const response=await fetch(`https://postify.zekiakgul.dev/release.json?expected=${expected}&t=${Date.now()}`,{cache:'no-store'});
              if(response.ok){
                const release=await response.json();
                last=release.sourceSha||'missing-sha';
                if(release.sourceSha===expected){console.log(`Production release matched ${expected}`);process.exit(0);}
              }else last=`HTTP ${response.status}`;
            }catch(error){last=error.message;}
            await new Promise((resolve)=>setTimeout(resolve,5000));
          }
          console.error(`Production did not reach ${expected}; last observed ${last}`);
          process.exit(1);
          NODE

      - name: Probe production capability and machine-readable artifacts
        run: |
          node --input-type=module <<'NODE'
          for(const path of ['/','/llms.txt','/verification-runs.json','/runtime-release-status.json','/knowledge-backend-status.json','/knowledge/node-json-dogrulama.tr.json']){
            const response=await fetch(`https://postify.zekiakgul.dev${path}?smoke=${Date.now()}`,{cache:'no-store'});
            if(!response.ok) throw new Error(`${path} returned ${response.status}`);
            console.log(`${path} ${response.status}`);
          }
          const capability=await fetch(`https://postify.zekiakgul.dev/knowledge-backend-status.json?t=${Date.now()}`,{cache:'no-store'}).then((r)=>r.json());
          const verification=await fetch(`https://postify.zekiakgul.dev/verification-runs.json?t=${Date.now()}`,{cache:'no-store'}).then((r)=>r.json());
          const runtimeStatus=await fetch(`https://postify.zekiakgul.dev/runtime-release-status.json?t=${Date.now()}`,{cache:'no-store'}).then((r)=>r.json());
          const run=verification.runs?.['node-json-parse-v1'];
          const signal=runtimeStatus.checks?.['node-json-parse-v1'];
          if(!run || !signal || signal.verifiedRuntimeVersion!==run.runtimeVersion || signal.requiredRuntimeMajor!==run.requiredRuntimeMajor){
            throw new Error('Production runtime freshness artifact is not bound to the executed verification run');
          }
          if(!['current','recheck-required','unknown'].includes(signal.status)) throw new Error(`Unexpected runtime freshness status: ${signal.status}`);
          console.log(`Verified Knowledge backend ready=${capability.ready} mode=${capability.mode} runtimeFreshness=${signal.status}`);
          NODE

      - name: Run production Chromium product suite
        env:
          PLAYWRIGHT_BASE_URL: https://postify.zekiakgul.dev
        run: npm run test:e2e:ui
