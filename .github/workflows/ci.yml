name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Test, Lint, Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify

  ui-e2e:
    name: Chromium Product E2E
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Start product server
        run: |
          npm run dev -- --host 0.0.0.0 --port 4174 --strictPort > /tmp/postify-vite.log 2>&1 &
          echo $! > /tmp/postify-vite.pid

      - name: Wait for product server
        run: |
          node --input-type=module <<'NODE'
          const deadline=Date.now()+30_000;
          while(Date.now()<deadline){
            try{const response=await fetch('http://127.0.0.1:4174/');if(response.ok)process.exit(0);}catch{}
            await new Promise((resolve)=>setTimeout(resolve,500));
          }
          process.exit(1);
          NODE

      - name: Run Chromium product suite
        run: npm run test:e2e:ui
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/postify-vite.log || true

  schema-verify:
    name: Verified Knowledge Schema & RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postify
          POSTGRES_DB: postify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postify
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth roles for dry-run
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key,email text,raw_user_meta_data jsonb default '{}'::jsonb);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create schema storage;
          create table storage.buckets(
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects(
            id uuid primary key default gen_random_uuid(),
            bucket_id text,
            name text not null,
            owner_id text
          );
          alter table storage.objects enable row level security;
          create or replace function storage.foldername(name text)
          returns text[] language sql immutable
          as $$ select string_to_array(name, '/') $$;
          create role anon nologin;
          create role authenticated nologin;
          SQL
      - name: Apply all migrations in order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify -f "$migration"
          done
      - name: Verify RLS and abuse boundaries
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postify -f supabase/verify-verified-knowledge.sql

  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [verify, ui-e2e, schema-verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check deploy prerequisites
        id: prereq
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions > Variables to enable automatic deployment."
          fi

      - name: Build
        if: steps.prereq.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: https://postify.zekiakgul.dev
          VITE_APP_NAME: Postify

      - name: Export production machine-readable knowledge
        if: steps.prereq.outputs.ready == 'true'
        run: npm run export:knowledge
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        if: steps.prereq.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
