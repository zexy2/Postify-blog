name: Bug report
description: Report a reproducible problem in Postify
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for someone else to reproduce it.
        Do not include secrets, private user data, or security vulnerability details here; use the Security tab for those.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability or private-data disclosure.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected URL or route
      placeholder: https://postify.zekiakgul.dev/...

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - Production
        - Local development
        - Pull request / preview environment
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / runtime
      placeholder: Chrome 151, Safari 19, Node 24, etc.

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or other evidence
      description: Add useful evidence after removing secrets and private information.

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include regressions, accessibility impact, frequency, or anything else that may help.
